name: CD - Deploy to Firebase Hosting & Rules

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: 📦 Install Dependencies
        run: yarn install --frozen-lockfile

      - name: 🔍 TypeScript Compile Check
        run: npx tsc --noEmit

      - name: 🧪 Execute Tests
        run: yarn test --passWithNoTests --ci

      - name: 🏗️ Export Web Production Bundle
        run: yarn build:web
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN || 'saltdistribute-2026.firebaseapp.com' }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID || 'saltdistribute-2026' }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET || 'saltdistribute-2026.firebasestorage.app' }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_VAPID_KEY }}

      - name: 🚀 Deploy to Firebase Hosting & Firestore Rules
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SALTDISTRIBUTE_2026 }}'
          channelId: live
          projectId: saltdistribute-2026
        continue-on-error: true

      - name: 🚀 Fallback Firebase CLI Deploy
        if: steps.deploy-action.outcome == 'failure' || env.FIREBASE_TOKEN != ''
        run: npx -y firebase-tools@latest deploy --only hosting,firestore:rules --token "${{ secrets.FIREBASE_TOKEN }}" --project saltdistribute-2026
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
