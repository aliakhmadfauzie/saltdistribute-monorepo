name: Build Android APK / EAS Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (preview / production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: 📦 Install Dependencies
        run: yarn install --frozen-lockfile

      - name: 🔍 TypeScript Compile Check
        run: npx tsc --noEmit

      - name: 🧪 Execute Unit Tests
        run: yarn test --passWithNoTests --ci

      - name: 📱 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🚀 Run EAS Build for Android
        if: env.EXPO_TOKEN != ''
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
